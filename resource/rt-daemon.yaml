apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rt-daemon
  namespace: kube-system
  labels:
    k8s-app: rt-daemon
spec:
  selector:
    matchLabels:
      name: rt-daemon
  template:
    metadata:
      labels:
        name: rt-daemon
    spec:
      hostNetwork: true  # Use host network for easier communication
      containers:
      - name: rt-daemon
        image: ghcr.io/hufs-mco/resource-controller  # Replace with your registry path
        securityContext:
          privileged: true  # Required for cgroup access
        volumeMounts:
        - name: sys
          mountPath: /sys
        - name: cgroup
          mountPath: /sys/fs/cgroup
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
        - name: crictl-bin
          mountPath: /usr/local/bin/crictl
          readOnly: true
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
        livenessProbe:
          httpGet:
            path: /healthz  # You might need to add this endpoint
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: sys
        hostPath:
          path: /sys
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
      - name: crictl-bin
        hostPath:
          path: /usr/bin/crictl
      serviceAccount: rt-daemon
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rt-daemon
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rt-daemon
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rt-daemon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rt-daemon
subjects:
- kind: ServiceAccount
  name: rt-daemon
  namespace: kube-system